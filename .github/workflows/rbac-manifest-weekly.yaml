name: RBAC docs weekly refresh

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"

      - name: Refresh generated RBAC role names from rbac-config
        run: make generate-docs

      - name: Open PR if data changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          title: "chore: refresh RBAC role names from rbac-config"
          body: |
            Automated weekly refresh of generated RBAC role display names in
            README and docs from RedHatInsights/rbac-config plus
            `configs/tool_rest_map.json` (`make generate-docs`).
          branch: chore/rbac-manifest-weekly
          commit-message: "chore: refresh RBAC role names from rbac-config"
