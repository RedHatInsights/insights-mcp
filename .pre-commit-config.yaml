# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
      - id: end-of-file-fixer
      - id: check-added-large-files
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]
  - repo: https://github.com/schuellerf/pre-commit-pyspelling
    rev: 0.1.0
    hooks:
      - id: pyspelling
        args: ["--config", ".spellcheck.yml"]
  # mypy and pylint run via `uv run --frozen` so types and imports come from
  # uv.lock (the project extra/dev env), not a second pip-resolved hook venv.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types_or: [python, pyi]
        require_serial: true
        # same defaults as pre-commit/mirrors-mypy
        args: [--ignore-missing-imports, --scripts-are-modules]
  - repo: https://github.com/hhatto/autopep8
    rev: v2.3.2
    hooks:
      - id: autopep8
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: uv run --frozen pylint
        language: system
        # always pass all classes, otherwise e.g. tests fail
        stages: [manual]
        pass_filenames: false
        args: [--recursive=y, src, tests, scripts/mcp_registry]
      - id: check-generated-docs
        name: Check generated docs (usage, toolsets, catalog-info)
        entry: bash -c 'make generate-docs && git diff --exit-code usage.md toolsets.md catalog-info.yaml docs/mkdocs/index.md docs/mkdocs/HACKING.md'
        language: system
        pass_filenames: false
        stages: [manual]
      - id: build-mkdocs
        name: Build mkdocs docs (--strict)
        entry: bash -c 'make build-mkdocs'
        language: system
        pass_filenames: false
        stages: [manual]
